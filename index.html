<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Early Warning Disaster Sensor Network Simulation</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-badge {
            font-size: 0.8rem;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            background-color: rgba(34, 197, 94, 0.15);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .status-badge.alert {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
            border-color: var(--accent-red);
            animation: pulse 1s infinite;
        }

        /* Disaster Trigger Controls */
        .controls-bar {
            background-color: #162032;
            padding: 0.75rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .controls-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            margin-right: 0.5rem;
        }

        button.sim-btn {
            background-color: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.45rem 0.9rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        button.sim-btn:hover {
            border-color: var(--accent-blue);
            background-color: #26354d;
        }

        button.sim-btn.active {
            background-color: rgba(239, 68, 68, 0.25);
            border-color: var(--accent-red);
            color: #fca5a5;
        }

        button.reset-btn {
            margin-left: auto;
            background-color: rgba(56, 189, 248, 0.15);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        /* Main Layout */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 380px;
            flex: 1;
        }

        @media (max-width: 960px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }

        /* Interactive Environment Canvas */
        .map-container {
            position: relative;
            width: 100%;
            min-height: 560px;
            background: linear-gradient(180deg, 
                #030712 0%,      /* Space / LEO */
                #0c192c 24%,     /* Upper Atmosphere */
                #1e3a5f 38%,     /* Horizon Sky */
                #14532d 39%,     /* Forest / Land */
                #3f2e21 68%,     /* Underground / Crust */
                #0c4a6e 69%,     /* Ocean Surface */
                #041d2e 100%     /* Deep Ocean Floor */
            );
            overflow: hidden;
            user-select: none;
        }

        .zone-label {
            position: absolute;
            left: 14px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.45);
            pointer-events: none;
            font-weight: 700;
        }

        /* SVG Terrain & Signal Lines */
        svg.scene-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .signal-line {
            stroke: var(--accent-blue);
            stroke-width: 2;
            stroke-dasharray: 6 6;
            opacity: 0.35;
            fill: none;
            transition: all 0.3s;
        }

        .signal-line.transmitting {
            stroke: var(--accent-red);
            stroke-width: 3.5;
            opacity: 1;
            animation: dashFlow 0.6s linear infinite;
        }

        @keyframes dashFlow {
            to {
                stroke-dashoffset: -12;
            }
        }

        /* Sensor Nodes */
        .sensor-node {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.2s;
        }

        .sensor-node:hover {
            transform: translate(-50%, -50%) scale(1.1);
        }

        .node-icon {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background-color: var(--panel-bg);
            border: 2px solid var(--accent-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
        }

        .sensor-node.selected .node-icon {
            border-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.45);
        }

        .sensor-node.triggered .node-icon {
            border-color: var(--accent-red);
            background-color: #450a0a;
            animation: pulse 0.8s infinite;
        }

        .node-tag {
            margin-top: 6px;
            background-color: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .sensor-node.triggered .node-tag {
            border-color: var(--accent-red);
            color: #fca5a5;
        }

        /* Right Side Inspector & Telemetry Panel */
        .sidebar {
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .inspector {
            padding: 1.5rem;
        }

        .inspector-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .inspector-icon {
            font-size: 2rem;
            background: var(--bg-dark);
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .inspector-title h2 {
            font-size: 1.15rem;
            color: var(--text-main);
        }

        .inspector-title span {
            font-size: 0.8rem;
            color: var(--accent-blue);
            font-weight: 600;
        }

        .detail-group {
            margin-bottom: 1.1rem;
        }

        .detail-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
            font-weight: 700;
        }

        .detail-value {
            font-size: 0.92rem;
            line-height: 1.45;
            color: #e2e8f0;
        }

        .disaster-pill {
            display: inline-block;
            padding: 0.25rem 0.65rem;
            border-radius: 4px;
            background-color: rgba(245, 158, 11, 0.15);
            border: 1px solid var(--accent-amber);
            color: #fcd34d;
            font-size: 0.82rem;
            font-weight: 600;
        }

        /* Live Telemetry Waveform / Readout */
        .telemetry-box {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.85rem;
            margin-top: 1rem;
        }

        .telemetry-row {
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
        }

        .telemetry-val {
            color: var(--accent-green);
            font-weight: bold;
        }

        .telemetry-val.danger {
            color: var(--accent-red);
        }

        /* Event Log Terminal */
        .log-panel {
Use code with caution.
border-top: 1px solid var(--border-color);
background-color: #0b1120;
padding: 1rem 1.5rem;
height: 210px;
display: flex;
flex-direction: column;
}
.log-title {
font-size: 0.75rem;
text-transform: uppercase;
color: var(--text-muted);
letter-spacing: 0.8px;
margin-bottom: 0.5rem;
font-weight: 700;
}
.log-feed {
flex: 1;
overflow-y: auto;
font-family: monospace;
font-size: 0.8rem;
display: flex;
flex-direction: column;
gap: 0.4rem;
}
.log-entry {
line-height: 1.35;
color: #cbd5e1;
}
.log-entry.alert {
color: #f87171;
}
.log-entry.info {
color: #38bdf8;
}
@keyframes pulse {
0%, 100% { transform: scale(1); }
50% { transform: scale(1.08); }
}
.shake-anim {
animation: screenShake 0.4s infinite;
}
@keyframes screenShake {
0% { transform: translate(0, 0); }
25% { transform: translate(-3px, 2px); }
50% { transform: translate(3px, -2px); }
75% { transform: translate(-2px, -2px); }
100% { transform: translate(0, 0); }
}

let selectedSensorId = 'base';
let activeTriggeredSensors = new Set();
function selectSensor(id) {
selectedSensorId = id;
document.querySelectorAll('.sensor-node').forEach(node => {
node.classList.remove('selected');
});
document.getElementById('node-' + id).classList.add('selected');
renderInspector();
}
function renderInspector() {
const s = sensors[selectedSensorId];
const isAlert = activeTriggeredSensors.has(selectedSensorId);
document.getElementById('inspIcon').textContent = s.icon;
document.getElementById('inspName').textContent = s.name;
document.getElementById('inspLocation').textContent = '📍 ' + s.location;
document.getElementById('inspDisaster').textContent = s.disaster;
document.getElementById('inspHow').textContent = s.how;
const telData = isAlert ? s.alertTelemetry : s.normalTelemetry;
for (let i = 0; i < 3; i++) {
document.getElementById(telMetric${i+1}Label).textContent = telData[i][0];
const valEl = document.getElementById(telMetric${i+1}Val);
valEl.textContent = telData[i][1];
valEl.className = isAlert ? 'telemetry-val danger' : 'telemetry-val';
}
}
function addLog(message, type = '') {
const feed = document.getElementById('logFeed');
const entry = document.createElement('div');
const time = new Date().toLocaleTimeString([], { hour12: false });
entry.className = log-entry ${type};
entry.textContent = [${time}] ${message};
feed.prepend(entry);
}
function triggerDisaster(type, btnElement) {
resetSimulation(false);
btnElement.classList.add('active');
const statusBadge = document.getElementById('systemStatus');
statusBadge.textContent = '⚠ EMERGENCY ALERT ACTIVE';
statusBadge.classList.add('alert');
const map = document.getElementById('mapContainer');
let triggeredList = [];
let focusSensor = 'base';
let alertMessage = '';
if (type === 'earthquake') {
triggeredList = ['seismometer', 'satellite', 'base'];
focusSensor = 'seismometer';
alertMessage = 'SEISMOMETER detected strong P/S waves! Satellite confirms ground shift. Base Station issuing Earthquake alert.';
map.classList.add('shake-anim');
setTimeout(() => map.classList.remove('shake-anim'), 1600);
} else if (type === 'bushfire') {
triggeredList = ['weather', 'satellite', 'base'];
focusSensor = 'weather';
alertMessage = 'REMOTE WEATHER STATION detected smoke & high heat! Satellite AI & synoptic charts confirm fire spread.';
} else if (type === 'flood') {
triggeredList = ['stream', 'satellite', 'base'];
focusSensor = 'stream';
alertMessage = 'STREAM GAUGE radar/sonar recorded rapid river surge! Base Station broadcasting Flood warning.';
} else if (type === 'volcano') {
triggeredList = ['volcano', 'seismometer', 'satellite', 'base'];
focusSensor = 'volcano';
alertMessage = 'GAS & TILT SPECTROMETER detected sulfur dioxide spike and slope swelling! Magma rising.';
} else if (type === 'tsunami') {
triggeredList = ['tsunami', 'seismometer', 'satellite', 'base'];
focusSensor = 'tsunami';
alertMessage = 'DART TSUNAMI BUOY felt sudden seafloor pressure spike! Acoustic signal relayed via surface buoy & satellite to Base Station.';
map.classList.add('shake-anim');
setTimeout(() => map.classList.remove('shake-anim'), 1000);
}
triggeredList.forEach(id => {
activeTriggeredSensors.add(id);
const node = document.getElementById('node-' + id);
if (node) node.classList.add('triggered');
const line = document.getElementById('line-' + id);
if (line) line.classList.add('transmitting');
});
selectSensor(focusSensor);
addLog(alertMessage, 'alert');
}
function resetSimulation(logReset = true) {
activeTriggeredSensors.clear();
document.querySelectorAll('.sim-btn').forEach(b => b.classList.remove('active'));
document.querySelectorAll('.sensor-node').forEach(n => n.classList.remove('triggered'));
document.querySelectorAll('.signal-line').forEach(l => l.classList.remove('transmitting'));
const statusBadge = document.getElementById('systemStatus');
statusBadge.textContent = '● ALL SYSTEMS NOMINAL';
statusBadge.classList.remove('alert');
renderInspector();
if (logReset) {
addLog('All alerts cleared. Sensors returned to normal monitoring state.', 'info');
}
}
// Initialize view
renderInspector();
